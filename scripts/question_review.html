<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตรวจคำถามชุด dev/test</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#5b6675; --line:#d9dee5; --ok:#1d7a46; --edit:#9a6700; --bad:#b3261e; --hl:#fff0a8; --acc:#1f4e8c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --card:#1c222a; --ink:#e7ebf0; --mute:#9aa6b4; --line:#2d3641; --ok:#5ec98a; --edit:#e0b04a; --bad:#ff8a80; --hl:#5a4a00; --acc:#8ab4f0; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Tahoma","Noto Sans Thai",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  header h1 { font-size:17px; margin:0; }
  .stat { color:var(--mute); font-size:14px; }
  button, select, input[type=text] { font:inherit; }
  button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  main { max-width:1080px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  .q { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--line); border-radius:8px; padding:14px 16px; }
  .q.accept { border-left-color:var(--ok); } .q.edit { border-left-color:var(--edit); } .q.reject { border-left-color:var(--bad); }
  .meta { color:var(--mute); font-size:13px; display:flex; flex-wrap:wrap; gap:4px 14px; }
  .qtext { font-size:18px; font-weight:600; margin:6px 0; }
  label.f { display:block; font-size:13px; color:var(--mute); margin-top:8px; }
  textarea, input[type=text] { width:100%; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); padding:6px 8px; }
  .pages { display:grid; gap:8px; margin-top:8px; }
  details { border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  details pre { white-space:pre-wrap; font:14px/1.6 "Tahoma","Noto Sans Thai",sans-serif; margin:6px 0 0; max-height:360px; overflow:auto; }
  mark { background:var(--hl); color:inherit; padding:0 1px; }
  .quote { border-left:3px solid var(--hl); padding-left:8px; color:var(--ink); }
  .choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .choices label { border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; }
  .choices input { margin-right:6px; }
  .hint { font-size:13px; color:var(--mute); }
  .shared { border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  a { color:var(--acc); }
  #who { max-width:200px; }
</style>
</head>
<body>
<header>
  <h1>ตรวจคำถาม — <span id="part"></span></h1>
  <span class="stat" id="stat"></span>
  <label>ชื่อผู้ตรวจ <input type="text" id="who" placeholder="ชื่อของคุณ"></label>
  <select id="filter"><option value="all">แสดงทั้งหมด</option><option value="todo">ยังไม่ตัดสิน</option><option value="accept">ถูกต้อง</option><option value="edit">แก้ไข</option><option value="reject">ปฏิเสธ</option></select>
  <button class="primary" id="export">ส่งออกผล (JSON)</button>
  <button id="import">นำเข้าผลเดิม</button><input type="file" id="file" accept=".json" hidden>
</header>
<main id="list"></main>
<script>
const DATA = /*DATA*/null;
const KEY = "qreview:" + DATA.part_id;
const state = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} stats(); }
const $ = (s) => document.querySelector(s);
document.querySelector("#part").textContent = DATA.part_label + " (" + DATA.questions.length + " ข้อ)";
$("#who").value = state.__who || "";
$("#who").addEventListener("input", (e) => { state.__who = e.target.value; save(); });

function esc(t) { return t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function highlight(text, quotes) {
  let out = esc(text);
  quotes.forEach((q) => { const e = esc(q); if (e && out.includes(e)) out = out.replace(e, "<mark>" + e + "</mark>"); });
  return out;
}
function render() {
  const f = $("#filter").value, box = $("#list"); box.innerHTML = "";
  DATA.questions.forEach((q) => {
    const s = state[q.qid] || {}; const d = s.decision || "todo";
    if (f !== "all" && f !== d) return;
    const el = document.createElement("section"); el.className = "q " + (d === "todo" ? "" : d); el.id = q.qid;
    const quotes = q.evidence.map((e) => e.quote);
    const pages = q.evidence.map((e) => {
      const p = DATA.pages[e.document_id + ":p" + e.pdf_page];
      const links = [];
      if (e.local_pdf) links.push(`<a href="${esc(e.local_pdf)}#page=${e.pdf_page}" target="_blank" rel="noopener">เปิด PDF ในเครื่อง (ต้องรัน server ก่อน; หน้า ${e.pdf_page})</a>`);
      if (e.pdf_url) links.push(`<a href="${esc(e.pdf_url)}#page=${e.pdf_page}" target="_blank" rel="noopener">เปิด PDF หน้า ${e.pdf_page}</a>`);
      if (e.url) links.push(`<a href="${esc(e.url)}" target="_blank" rel="noopener">หน้าเว็บต้นทาง</a>`);
      const link = links.length ? " · " + links.join(" · ") : "";
      if (p === undefined) return `<div class="shared"><b>${esc(e.document_id)} · หน้า PDF ${e.pdf_page}</b>${link}<div class="quote">${esc(e.quote)}</div><div class="hint">ไฟล์ชุดนี้ไม่ฝังข้อความหน้า: เปิดต้นฉบับที่ลิงก์ ไปที่หน้า PDF ${e.pdf_page} (นับจากหน้าแรกของไฟล์ PDF) แล้วอ่านบริบทรอบ quote</div></div>`;
      return `<details><summary>${esc(e.document_id)} · หน้า PDF ${e.pdf_page}${link} — quote: <span class="quote">${esc(e.quote)}</span></summary><pre>${highlight(p, quotes)}</pre></details>`;
    }).join("");
    el.innerHTML = `
      <div class="meta"><b>${q.qid}</b><span>${q.split}</span><span>ชนิด: ${q.type}</span><span>${q.answerable ? "ตอบได้จากเอกสาร" : "ไม่มีคำตอบในเอกสาร"}</span><span>${esc(q.evidence.map((e) => e.document_id + " p" + e.pdf_page).join(" + "))}</span></div>
      <div class="qtext">${esc(q.question)}</div>
      <div><b>คำตอบร่าง:</b> ${q.answer === null ? "<i>(ไม่มี — ควรไม่พบคำตอบในเอกสาร)</i>" : esc(q.answer)}</div>
      <div class="pages">${pages}</div>
      <div class="choices">
        <label><input type="radio" name="d-${q.qid}" value="accept" ${d === "accept" ? "checked" : ""}>ถูกต้อง ใช้ได้</label>
        <label><input type="radio" name="d-${q.qid}" value="edit" ${d === "edit" ? "checked" : ""}>แก้ไขแล้วใช้</label>
        <label><input type="radio" name="d-${q.qid}" value="reject" ${d === "reject" ? "checked" : ""}>ปฏิเสธ</label>
      </div>
      <div class="edit-area" ${d === "edit" ? "" : "hidden"}>
        <label class="f">คำถามที่แก้</label><textarea rows="2" data-k="question">${esc(s.question ?? q.question)}</textarea>
        <label class="f">คำตอบที่แก้ (เว้นว่างถ้าไม่มีคำตอบ)</label><textarea rows="2" data-k="answer">${esc(s.answer ?? (q.answer || ""))}</textarea>
      </div>
      <label class="f">หมายเหตุ (จำเป็นเมื่อแก้หรือปฏิเสธ: เหตุผลสั้นๆ)</label><input type="text" data-k="note" value="${esc(s.note || "")}">
      <div class="hint">เกณฑ์: ตอบได้จากหน้าที่ระบุจริง · quote ตรงกับคำตอบ · คำถามเข้าใจได้โดยไม่ต้องเห็นหน้า · ไม่ได้ลอกถ้อยคำจากหน้า · ไม่มีชื่อ/เบอร์คน${q.type === "unanswerable" ? " · ข้อนี้ต้องไม่มีคำตอบในเอกสารหน้าใกล้เคียง (ถ้าพบคำตอบ ให้ปฏิเสธ)" : ""}</div>`;
    el.querySelectorAll("input[type=radio]").forEach((r) => r.addEventListener("change", (e) => { state[q.qid] = { ...(state[q.qid] || {}), decision: e.target.value }; save(); render(); }));
    el.querySelectorAll("[data-k]").forEach((i) => i.addEventListener("input", (e) => { state[q.qid] = { ...(state[q.qid] || {}), [e.target.dataset.k]: e.target.value }; save(); }));
    box.appendChild(el);
  });
}
function stats() {
  const c = { accept: 0, edit: 0, reject: 0 };
  DATA.questions.forEach((q) => { const d = (state[q.qid] || {}).decision; if (d) c[d]++; });
  const done = c.accept + c.edit + c.reject;
  $("#stat").textContent = `ตัดสินแล้ว ${done}/${DATA.questions.length} · ถูกต้อง ${c.accept} · แก้ ${c.edit} · ปฏิเสธ ${c.reject}`;
}
$("#filter").addEventListener("change", render);
$("#export").addEventListener("click", () => {
  const missing = DATA.questions.filter((q) => { const s = state[q.qid] || {}; return !s.decision || ((s.decision === "edit" || s.decision === "reject") && !(s.note || "").trim()); });
  if (!(state.__who || "").trim()) { alert("กรอกชื่อผู้ตรวจก่อน"); return; }
  if (missing.length && !confirm(`ยังมี ${missing.length} ข้อที่ยังไม่ตัดสินหรือไม่มีหมายเหตุ (แก้/ปฏิเสธต้องมีหมายเหตุ) ส่งออกเท่าที่มีไหม?`)) return;
  const out = { part_id: DATA.part_id, reviewer: state.__who.trim(), exported_at: new Date().toISOString(), decisions: DATA.questions.filter((q) => (state[q.qid] || {}).decision).map((q) => ({ qid: q.qid, ...state[q.qid] })) };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }));
  a.download = `question_review_${DATA.part_id}_${state.__who.trim().replace(/\s+/g, "_")}.json`; a.click();
});
$("#import").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", async (e) => {
  const j = JSON.parse(await e.target.files[0].text());
  (j.decisions || []).forEach((d) => { state[d.qid] = d; }); if (j.reviewer) { state.__who = j.reviewer; $("#who").value = j.reviewer; }
  save(); render();
});
stats(); render();
</script>
</body>
</html>
